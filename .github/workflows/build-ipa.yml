name: Build Ich schaffe das A1 IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ich-schaffe-das-a1-source-v6.zip'
      - '.github/workflows/build-ipa.yml'
jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Unpack app source
        run: unzip -q ich-schaffe-das-a1-source-v6.zip
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: learning_app
        run: flutter pub get
      - name: Validate course and video coverage
        working-directory: learning_app
        run: node tool/validate_course.js
      - name: Test
        working-directory: learning_app
        run: flutter test
      - name: Build unsigned iOS app
        working-directory: learning_app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        working-directory: learning_app
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry Ich-schaffe-das-A1-v6-unsigned.ipa Payload
          unzip -tq Ich-schaffe-das-A1-v6-unsigned.ipa
      - uses: actions/upload-artifact@v5
        with:
          name: ich-schaffe-das-a1-v6-unsigned-ipa
          path: learning_app/build/ipa/Ich-schaffe-das-A1-v6-unsigned.ipa
