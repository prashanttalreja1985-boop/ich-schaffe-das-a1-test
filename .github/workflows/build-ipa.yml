name: Build Ich schaffe das A1 IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ich-schaffe-das-a1-source-v26.zip'
      - '.github/workflows/build-ipa.yml'
jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Unpack app source
        run: unzip -oq ich-schaffe-das-a1-source-v26.zip
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: learning_app
        run: flutter pub get
      - name: Build the 10-topic A1 course and import SQL
        working-directory: learning_app
        run: |
          node tool/build_a1_course.js
          python3 tool/import_book.py assets/starter_content.json tool/starter_import.sql --publish
      - name: Validate course and video coverage
        working-directory: learning_app
        run: node tool/validate_course.js
      - name: Generate and validate lexical reference
        working-directory: learning_app
        run: node tool/build_lexicon.js
      - name: Analyze
        working-directory: learning_app
        run: flutter analyze
      - name: Test
        working-directory: learning_app
        run: flutter test
      - name: Verify YouTube Shorts search
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$YOUTUBE_API_KEY"
          curl --fail-with-body --silent --show-error --get \
            -H "X-Goog-Api-Key: $YOUTUBE_API_KEY" \
            -H "X-Ios-Bundle-Identifier: de.ichschaffedas.a1" \
            --data-urlencode 'part=snippet' \
            --data-urlencode 'q=#travel #shorts' \
            --data-urlencode 'type=video' \
            --data-urlencode 'videoDuration=short' \
            --data-urlencode 'videoEmbeddable=true' \
            --data-urlencode 'maxResults=5' \
            https://www.googleapis.com/youtube/v3/search \
            -o /tmp/ich-schaffe-das-shorts-search.json
          python3 -c "import json; d=json.load(open('/tmp/ich-schaffe-das-shorts-search.json')); assert d.get('items'), 'No embeddable videos found'; print('YouTube search returned',len(d['items']),'videos')"
      - name: Build unsigned iOS app
        working-directory: learning_app
        env:
          SUPABASE_URL: https://sxfgtggqmloiwiayfqpv.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8OiunRfPrpAW09gv1gN30g_xwXfGOga
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: flutter build ios --release --no-codesign --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" --dart-define="YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
      - name: Package unsigned IPA
        working-directory: learning_app
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry Ich-schaffe-das-A1-v26-unsigned.ipa Payload
          unzip -tq Ich-schaffe-das-A1-v26-unsigned.ipa
      - uses: actions/upload-artifact@v5
        with:
          name: ich-schaffe-das-a1-v26-unsigned-ipa
          path: learning_app/build/ipa/Ich-schaffe-das-A1-v26-unsigned.ipa
